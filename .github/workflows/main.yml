name: Build Mindustry iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Download Mindustry source
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download the required Arc source
        run: |
          set -e
          git clone https://github.com/Anuken/Arc.git ../Arc
          cd ../Arc
          git checkout 7445105cd2
          echo "=== Arc commit ==="
          git rev-parse HEAD

      - name: Build Arc iOS natives and prepare MetalANGLEKit
        run: |
          set -e
          cd ../Arc
          chmod +x gradlew

          # 1) MetalANGLEKit (this wipes backend-robovm/res/META-INF/robovm/ios/libs, so it has to run first)
          ./gradlew :backends:backend-robovm:extractMetalANGLEKit --stacktrace

          # 2) arc.xcframework (the "arc" framework that ios/robovm.xml asks for)
          ./gradlew :arc-core:jnigenBuildAllIOS --stacktrace

          XCF=$(find . -type d -name "arc.xcframework" -not -path "./backends/*" | head -n 1)
          if [ -z "$XCF" ]; then
            echo "ERROR: arc.xcframework was not generated"
            exit 1
          fi
          echo "=== arc.xcframework found at: $XCF ==="
          find "$XCF" -maxdepth 2

          # 3) put it next to MetalANGLEKit so it is packaged into the backend jar
          cp -R "$XCF" backends/backend-robovm/res/META-INF/robovm/ios/libs/

          # 4) build the jar
          ./gradlew :backends:backend-robovm:jar --stacktrace

          echo "=== Verify packaged resources ==="
          JAR=backends/backend-robovm/build/libs/backend-robovm-1.0.jar
          unzip -l "$JAR" > /tmp/jar-listing.txt
          grep -i "MetalANGLEKit" /tmp/jar-listing.txt | head -n 5 || true
          grep -i "arc.xcframework" /tmp/jar-listing.txt | head -n 5 || true
          if ! grep -q -i "arc.xcframework" /tmp/jar-listing.txt; then
            echo "ERROR: arc.xcframework is not inside the backend-robovm jar"
            exit 1
          fi

      - name: Disable iOS signing
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/build.gradle")
          text = path.read_text()

          if "iosSkipSigning = false" in text:
              text = text.replace(
                  "iosSkipSigning = false",
                  "iosSkipSigning = true",
                  1
              )
              path.write_text(text)
              print("iOS signing disabled.")
          elif "iosSkipSigning = true" in text:
              print("iOS signing is already disabled.")
          else:
              raise SystemExit(
                  "Could not find iosSkipSigning in ios/build.gradle"
              )
          PY

      - name: Check Gradle configuration
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --version

      - name: Build Mindustry
        run: |
          set -e
          ./gradlew :tools:pack --stacktrace

      - name: Copy iOS native libraries
        run: |
          set -e
          ./gradlew :ios:copyNatives --stacktrace

      - name: Create IPA
        run: |
          set -e
          ./gradlew :ios:createIPA --stacktrace --info

      - name: Find generated IPA
        if: always()
        run: |
          echo "=== IPA files ==="
          find "$GITHUB_WORKSPACE" -type f -iname "*.ipa" -print

          echo "=== MetalANGLEKit resources ==="
          find "$GITHUB_WORKSPACE/../Arc/backends/backend-robovm" \
            -iname "*MetalANGLEKit*" -print || true

          echo "=== Build output directories ==="
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type d \
            \( -name build -o -name export -o -name output \) -print

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-IPA
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 7
