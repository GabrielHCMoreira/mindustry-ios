
name: Build Mindustry iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configure iOS signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/build.gradle")
          content = path.read_text()

          old = "iosSkipSigning = false"
          new = "iosSkipSigning = true"

          if old not in content:
              raise SystemExit(
                  "Não encontrei iosSkipSigning = false em ios/build.gradle"
              )

          path.write_text(content.replace(old, new, 1))
          print("Assinatura automática desativada para o build.")
          PY

      - name: Build Mindustry
        run: |
          chmod +x gradlew
          ./gradlew :tools:pack
          ./gradlew :ios:createIPA

      - name: Locate IPA
        if: always()
        run: |
          echo "=== Arquivos IPA encontrados ==="
          find "$GITHUB_WORKSPACE" -type f -iname "*.ipa" -print
          echo "=== Fim da busca ==="

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-IPA
          path: "**/*.ipa"
          if-no-files-found: error
