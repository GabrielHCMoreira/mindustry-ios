
name: Build Mindustry iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build Mindustry
        run: |
          chmod +x gradlew
          ./gradlew :tools:pack
          ./gradlew createIPA

      - name: Locate IPA
        if: always()
        run: |
          find . -type f -name "*.ipa" -print

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-IPA
          path: "**/*.ipa"
          if-no-files-found: error
