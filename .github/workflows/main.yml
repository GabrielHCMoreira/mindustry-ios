
name: Build Mindustry iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Download source code
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check project configuration
        run: |
          echo "=== iOS build configuration ==="
          grep -n -i "iosSkipSigning" ios/build.gradle || true
          echo "=== Gradle wrapper ==="
          chmod +x gradlew
          ./gradlew --version

      - name: Disable iOS signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/build.gradle")
          text = path.read_text()

          if "iosSkipSigning = false" in text:
              text = text.replace(
                  "iosSkipSigning = false",
                  "iosSkipSigning = true",
                  1
              )
              path.write_text(text)
              print("Changed iosSkipSigning to true.")
          elif "iosSkipSigning = true" in text:
              print("iOS signing is already disabled.")
          else:
              print("Signing setting not found; inspecting build file:")
              for i, line in enumerate(text.splitlines(), 1):
                  if "sign" in line.lower() or "robovm" in line.lower():
                      print(f"{i}: {line}")
          PY

      - name: Build Mindustry and create IPA
        id: build
        run: |
          set -o pipefail
          ./gradlew :tools:pack --stacktrace
          ./gradlew :ios:createIPA --stacktrace --info

      - name: Find generated IPA
        if: always()
        run: |
          echo "=== IPA files ==="
          find "$GITHUB_WORKSPACE" -type f -iname "*.ipa" -print
          echo "=== Build output directories ==="
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type d \
            \( -name build -o -name export -o -name output \) -print
          echo "=== Candidate packages ==="
          find "$GITHUB_WORKSPACE" -type f \
            \( -name "*.zip" -o -name "*.app" \) -print | head -100

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-IPA
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 7
