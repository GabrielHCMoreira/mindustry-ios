name: Build Mindustry iOS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build IPA
        run: |
          chmod +x gradlew
          ./gradlew :tools:pack
          ./gradlew createIPA
          
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: Mindustry-IPA
          path: build/libs/*.ipa
