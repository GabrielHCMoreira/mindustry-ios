
name: Build Mindustry iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Download Mindustry source
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download matching Arc source
        run: |
          if [ ! -d ../Arc/.git ]; then
            git clone https://github.com/Anuken/Arc.git ../Arc
          fi

          git -C ../Arc fetch origin
          git -C ../Arc checkout 7445105cd2

          echo "=== Arc native libraries ==="
          find ../Arc/natives -type f \
            \( -name "*.a" -o -name "*.framework" -o -name "*.xcframework" \) \
            -print || true

      - name: Configure iOS signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/build.gradle")
          content = path.read_text()

          if "iosSkipSigning = false" in content:
              content = content.replace(
                  "iosSkipSigning = false",
                  "iosSkipSigning = true",
                  1
              )
              path.write_text(content)
              print("iOS signing disabled.")
          elif "iosSkipSigning = true" in content:
              print("iOS signing is already disabled.")
          else:
              print("Signing setting not found; checking configuration.")
              for number, line in enumerate(content.splitlines(), 1):
                  if "sign" in line.lower():
                      print(f"{number}: {line}")
          PY

      - name: Build Mindustry assets
        run: |
          chmod +x gradlew
          ./gradlew :tools:pack --stacktrace

      - name: Copy iOS native libraries
        run: |
          ./gradlew :ios:copyNatives --stacktrace

          echo "=== Checking freetype library ==="
          find ios ../Arc -name "libarc-freetype.a" -print

      - name: Build iOS IPA
        run: |
          ./gradlew :ios:createIPA --stacktrace --info

      - name: Inspect build outputs
        if: always()
        run: |
          echo "=== IPA files ==="
          find . -type f -iname "*.ipa" -print

          echo "=== App bundles ==="
          find . -type d -name "*.app" -print

          echo "=== Native freetype library ==="
          find ios ../Arc -name "libarc-freetype.a" -print

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-IPA
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 7
